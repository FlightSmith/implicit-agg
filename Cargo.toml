[workspace]
resolver = "2"
members = [
    "crates/aircraft-model",
    "crates/aircraft-expr",
    "crates/aircraft-graph",
    "crates/aircraft-geom",
    "crates/meshio",
    "crates/aircraft-engine",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/implicit-agg"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
aircraft-model = { path = "crates/aircraft-model" }
aircraft-expr = { path = "crates/aircraft-expr" }
aircraft-graph = { path = "crates/aircraft-graph" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
