[package]
name = "aircraft-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly binding of the aircraft engine; the browser compute core."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aircraft-engine = { path = "../aircraft-engine" }
aircraft-geom = { path = "../aircraft-geom" }
aircraft-graph = { path = "../aircraft-graph" }
aircraft-model = { path = "../aircraft-model" }
meshio = { path = "../meshio" }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
