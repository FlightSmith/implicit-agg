name: Release

# Ready-to-use zip packages of the batch exporter (aircraft CLI). Runs on
# every version tag (attaches the zips to a GitHub release) and on demand
# from the Actions tab (artifacts only, no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: implicit-agg-cli-linux-x64
            binary: aircraft
          - os: macos-14
            target: aarch64-apple-darwin
            archive: implicit-agg-cli-macos-arm64
            binary: aircraft
          - os: macos-13
            target: x86_64-apple-darwin
            archive: implicit-agg-cli-macos-x64
            binary: aircraft
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: implicit-agg-cli-windows-x64
            binary: aircraft.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p aircraft-cli --target ${{ matrix.target }}
      - name: Stage package contents
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/
          cp README.md stage/
      - name: Zip package (zip)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd stage
          zip "../${{ matrix.archive }}.zip" *
      - name: Zip package (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "${{ matrix.archive }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}.zip
          path: ${{ matrix.archive }}.zip
      - name: Attach to the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}.zip
